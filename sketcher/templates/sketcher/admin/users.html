<table>
{% for name in sketcher_users %}
    <tr>
        <td>{{ forloop.counter }}.</td>
        <td>{{ name }}</td>
        <td><a href="javascript:nop()" onclick="sketcherAdminFnc('kick', '{{ name|escapejs }}')">kick</a></td>
    </tr>
{% empty %}
    <tr><td>No users currently connected.</td></tr>
{% endfor %}
</table>
